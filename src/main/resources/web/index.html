<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>NautaTicket | Acceso</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

        :root {
            --bg: #000000;
            --surface: #0d0d0d;
            --surface-hover: #191919;
            --border: #292929;
            --text: #f2f2f4;
            --muted: #9a9aa2;
            --purple: #9783db;
            --purple-hover: #b0a0ec;
            --font: "IBM Plex Sans", "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
        }

        button, input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--purple);
            outline-offset: 3px;
        }

        [hidden] {
            display: none !important;
        }

        /* Estructura */

        .access-layout {
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr);
            min-height: 100vh;
            background: #000000;
        }

        .access-sidebar {
            display: flex;
            flex-direction: column;
            gap: 46px;
            padding: 25px 19px;
            background: #000000;
            border-right: 1px solid #242424;
        }

        /* Logotipo */

        .logo {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo-mark {
            width: 62px;
            height: 62px;
            min-width: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent;
            border: none;
        }

        .logo-mark img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text {
            color: var(--text);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Barra lateral */

        .sidebar-label {
            margin: 0 12px 14px;
            color: #777780;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 12px;
            color: #c8baf3;
            background: #181320;
            border-left: 2px solid var(--purple);
            border-radius: 5px;
            font-size: 13px;
        }

        .sidebar-link svg {
            display: block;
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }

        /* Contenido principal */

        .access-main {
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #000000;
        }

        .topbar {
            height: 68px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #242424;
        }

        .breadcrumb {
            color: #92929b;
            font-size: 12px;
        }

        .breadcrumb strong {
            color: var(--text);
            font-weight: 500;
        }

        .environment {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #9999a0;
            font-size: 11px;
        }

        .environment-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--purple);
        }

        .access-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 44px 24px;
        }

        .access-container {
            width: 100%;
            max-width: 470px;
        }

        .eyebrow {
            color: var(--purple);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-heading {
            margin-bottom: 27px;
        }

        .section-heading h1 {
            margin: 11px 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.7px;
        }

        .section-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        /* Panel */

        .access-panel {
            padding: 25px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .panel-title {
            margin: 0 0 19px;
            font-size: 13px;
            font-weight: 600;
        }

        .profile-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .profile-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px;
            color: var(--text);
            background: #131313;
            border: 1px solid #303030;
            border-radius: 7px;
            text-align: left;
            transition: background 150ms, border-color 150ms;
        }

        .profile-option:hover {
            background: var(--surface-hover);
            border-color: var(--purple);
        }

        .profile-symbol {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            background: #29213b;
            border-radius: 7px;
            color: #c4b3f4;
            font-size: 13px;
            font-weight: 600;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-info strong {
            display: block;
            font-size: 13px;
            font-weight: 600;
        }

        .profile-info small {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
        }

        .profile-arrow {
            color: #a59ab9;
            font-size: 20px;
        }

        /* Inicio de sesión */

        .selected-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            margin-bottom: 24px;
            background: #080808;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .selected-profile strong {
            color: #c4b5f2;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 19px;
        }

        .field label {
            color: #d2d2d6;
            font-size: 12px;
            font-weight: 500;
        }

        .input {
            width: 100%;
            height: 43px;
            padding: 0 13px;
            background: #080808;
            border: 1px solid #333333;
            border-radius: 6px;
            color: var(--text);
            outline: none;
        }

        .input:focus {
            border-color: var(--purple);
        }

        .input::placeholder {
            color: #77777d;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 17px;
        }

        .button {
            height: 42px;
            padding: 0 19px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 12px;
            font-weight: 600;
        }

        .button-primary {
            flex: 1;
            background: var(--purple);
            color: #0b0910;
        }

        .button-primary:hover {
            background: var(--purple-hover);
        }

        .button-secondary {
            background: #191919;
            color: #d0d0d5;
            border-color: #333333;
        }

        .button-secondary:hover {
            background: #252525;
        }

        .status {
            min-height: 17px;
            color: #d5a477;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 760px) {
            .access-layout {
                grid-template-columns: 1fr;
            }

            .access-sidebar {
                padding: 12px 20px;
                border-right: none;
                border-bottom: 1px solid #242424;
            }

            .sidebar-section {
                display: none;
            }

            .topbar {
                padding: 0 20px;
            }

            .access-content {
                padding: 35px 18px;
            }
        }

        @media (max-width: 480px) {
            .access-panel {
                padding: 20px;
            }

            .section-heading h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="access-layout">

    <aside class="access-sidebar">

        <div class="logo">
            <span class="logo-mark">
                <img src="assets/images/nautaticket-logo.png"
                     alt="Logotipo de NautaTicket">
            </span>
            <span class="logo-text">NautaTicket</span>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-label">Acceso</div>

            <div class="sidebar-link">
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.7">
                    <rect x="4" y="4"
                          width="16" height="16" rx="3"/>
                    <path d="M8 10h8M8 14h5"/>
                </svg>
                Inicio de sesión
            </div>
        </div>

    </aside>

    <main class="access-main">

        <header class="topbar">
            <div class="breadcrumb">
                NautaTicket /
                <strong>Acceso</strong>
            </div>

            <div class="environment">
                <span class="environment-dot"></span>
                Sistema de soporte
            </div>
        </header>

        <div class="access-content">

            <div class="access-container">

                <section id="profilesView">

                    <div class="section-heading">
                        <span class="eyebrow">
                            Centro de acceso
                        </span>

                        <h1>Bienvenido a NautaTicket</h1>

                        <p>
                            Selecciona tu perfil para continuar
                            al sistema.
                        </p>
                    </div>

                    <div class="access-panel">

                        <h2 class="panel-title">
                            Seleccionar perfil
                        </h2>

                        <div class="profile-list">

                            <button type="button"
                                    class="profile-option"
                                    data-profile="ADMIN"
                                    data-label="Administrador">

                                <span class="profile-symbol">A</span>

                                <span class="profile-info">
                                    <strong>Administrador</strong>
                                    <small>
                                        Administración y configuración
                                    </small>
                                </span>

                                <span class="profile-arrow">›</span>
                            </button>

                            <button type="button"
                                    class="profile-option"
                                    data-profile="TECNICO"
                                    data-label="Soporte técnico">

                                <span class="profile-symbol">T</span>

                                <span class="profile-info">
                                    <strong>Soporte técnico</strong>
                                    <small>
                                        Atención y resolución de tickets
                                    </small>
                                </span>

                                <span class="profile-arrow">›</span>
                            </button>

                            <button type="button"
                                    class="profile-option"
                                    data-profile="EMPLEADO"
                                    data-label="Empleado">

                                <span class="profile-symbol">E</span>

                                <span class="profile-info">
                                    <strong>Empleado</strong>
                                    <small>
                                        Registro y seguimiento de solicitudes
                                    </small>
                                </span>

                                <span class="profile-arrow">›</span>
                            </button>

                        </div>
                    </div>

                </section>

                <section id="loginView" hidden>

                    <div class="section-heading">
                        <span class="eyebrow">
                            Identificación
                        </span>

                        <h1>Iniciar sesión</h1>

                        <p>
                            Introduce tus credenciales
                            para acceder al sistema.
                        </p>
                    </div>

                    <div class="access-panel">

                        <div class="selected-profile">
                            Perfil:
                            <strong id="profileLabel"></strong>
                        </div>

                        <form id="loginForm" novalidate>

                            <div class="field">
                                <label for="correo">
                                    Correo electrónico
                                </label>

                                <input class="input"
                                       id="correo"
                                       name="correo"
                                       type="email"
                                       autocomplete="username"
                                       placeholder="correo@empresa.com"
                                       required>
                            </div>

                            <div class="field">
                                <label for="password">
                                    Contraseña
                                </label>

                                <input class="input"
                                       id="password"
                                       name="password"
                                       type="password"
                                       autocomplete="current-password"
                                       placeholder="Contraseña"
                                       required>
                            </div>

                            <p id="message"
                               class="status"
                               role="status"
                               aria-live="polite"></p>

                            <div class="form-actions">

                                <button type="button"
                                        class="button button-secondary"
                                        id="backBtn">
                                    Volver
                                </button>

                                <button type="submit"
                                        class="button button-primary">
                                    Ingresar
                                </button>

                            </div>

                        </form>
                    </div>

                </section>

            </div>
        </div>

    </main>
</div>

<script src="js/app.js"></script>

</body>
</html>
